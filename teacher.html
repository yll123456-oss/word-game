<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老师后台 · 单词大冒险</title>
<style>
  :root{--ink:#1f2430; --muted:#6b7280; --line:#e6e9f0; --blue:#3b5bdb; --soft:#eef1fb; --red:#e5484d; --amber:#b45309; --green:#0f9d76;}
  body{margin:0; background:#f4f6fb; color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 18px 70px;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  h1{font-size:19px; margin:0;}
  .sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}
  button, a.btn{border:0; background:var(--blue); color:#fff; font-size:13px; font-weight:700; padding:9px 14px; border-radius:11px; cursor:pointer; text-decoration:none; display:inline-block;}
  button.ghost, a.ghost{background:var(--soft); color:var(--blue);}
  button:active{transform:scale(.99);}
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; box-shadow:0 6px 18px rgba(31,41,55,.05);}
  .card b{display:block; font-size:22px; color:var(--blue);}
  .card span{font-size:11.5px; color:var(--muted);}
  .panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 6px 18px rgba(31,41,55,.05);}
  .panel h2{font-size:14px; margin:0 0 12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line);}
  th{font-size:11.5px; color:var(--muted); font-weight:600; background:#fafbfe;}
  tr.clk{cursor:pointer;}
  tr.clk:hover td{background:#fafbff;}
  .pill{display:inline-block; font-size:11px; padding:3px 8px; border-radius:99px; font-weight:600;}
  .pill.ok{background:#e7f7f1; color:var(--green);}
  .pill.no{background:#fdecec; color:var(--red);}
  .pill.warn{background:#fdf3e6; color:var(--amber);}
  .pill.gray{background:#f1f2f5; color:var(--muted);}
  .muted{color:var(--muted); font-size:12px;}
  .empty{color:var(--muted); font-size:13px; padding:14px 0; text-align:center;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:10px 0 6px;}
  .gup{color:var(--green);}
  .gdown{color:var(--red);}
  .grow-line{font-size:13px; line-height:1.9;}
  .grow-line b{font-size:15px;}
  .vpre-dayblock{margin-bottom:10px;}
  .vpre-dayblock > b{font-size:12px; color:var(--ink);}
  .vpre-dayline{font-size:11.5px; color:var(--muted); line-height:1.9; margin-top:6px;}
  .vpre-dayline b{color:var(--ink);}
  /* 每日一练 / 错题本：一行一个日期的列表 */
  .daylist{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 0 12px;}
  .dayitem{border-bottom:1px solid var(--line);}
  .dayitem:last-child{border-bottom:0;}
  .dayrow{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; background:#fff; border:0;
          cursor:pointer; text-align:left; font-family:inherit; color:var(--ink);}
  .daylist > .dayrow:last-child{border-bottom:0;}
  button.dayrow{border-bottom:1px solid var(--line);}
  .dayrow:hover{background:#f7f9ff;}
  .dayrow .d-date{font-size:13px; font-weight:700; white-space:nowrap;}
  .dayrow .d-sum{margin-left:auto; font-size:12px; color:var(--muted); text-align:right;}
  .dayrow .d-mark{width:14px; text-align:center; font-size:12px; color:var(--blue); visibility:hidden;}
  .dayrow .d-arrow{width:12px; text-align:center; font-size:11px; color:var(--muted); transition:transform .15s;}
  .dayrow .d-print{background:var(--soft); color:var(--blue); border:0; border-radius:9px; padding:5px 10px;
                   font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; margin-left:10px;}
  .dayrow .d-print:hover{background:#e2e8fb;}
  .dayitem.is-open > .dayrow{background:#f2f6ff;}
  .dayitem.is-open > .dayrow .d-arrow{transform:rotate(90deg);}
  .daybody{display:none; padding:10px 14px 14px; background:#fafbfe;}
  .dayitem.is-open > .daybody{display:block;}
  .daybody .vpre-dayline{margin-top:8px;}
  .dayrow.is-on{background:#eef3ff;}
  .dayrow.is-on .d-mark{visibility:visible; font-weight:800;}
  /* 使用前后对比：对比条 + 折线 + 成长点/失误点 */
  .gtext{background:#f7f9ff; border:1px solid #e2e8f6; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.95; color:var(--ink); margin:8px 0 10px;}
  .cmp{margin:10px 0 6px;}
  .cmprow{display:grid; grid-template-columns:64px 1fr 1fr 78px; gap:8px; align-items:center; margin-bottom:8px;}
  .cmpname{font-size:11.5px; color:var(--muted);}
  .cmpb{position:relative; background:#f4f6fb; border-radius:8px; height:26px; overflow:hidden;}
  .cmpb > i{display:block; height:100%; background:#c7cfe4;}
  .cmpb.is-now > i{background:#3b5bdb;}
  .cmpb > em{position:absolute; left:8px; top:50%; transform:translateY(-50%); font-style:normal; font-size:11px; color:#2b3a67; font-weight:700;}
  .cmpb.is-now > em{color:#fff;}
  .cmpd{font-size:11.5px; text-align:right;}
  .gbox2{border-radius:12px; padding:10px 12px; border:1px solid var(--line); background:#fff;}
  .gbox2.good{background:#f2fbf7; border-color:#c7ead9;}
  .gbox2.bad{background:#fff7f2; border-color:#f5d9c4;}
  .gbox2 > b{font-size:12.5px;}
  .gbox2 ul{margin:6px 0 0 16px; padding:0;}
  .gbox2 li{font-size:12px; line-height:1.75;}
  .vpre-chartbox{background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 10px 4px; margin-top:10px;}
  @media (max-width:820px){ .cards{grid-template-columns:1fr 1fr;} .two{grid-template-columns:1fr;} }
  #print-root{display:none;}
  @media print{
    body{background:#fff;}
    .wrap{display:none;}
    #print-root{display:block !important; padding:0; max-width:100%;}
    #print-root h1{font-size:18px; margin:0 0 4px;}
    #print-root h2{font-size:14px; margin:16px 0 8px;}
    #print-root table{font-size:12.5px;}
    #print-root th,#print-root td{border-bottom:1px solid #ddd; padding:6px 6px;}
    #print-root thead th{background:#f4f6fb;}
    #print-root .head{border-bottom:2px solid #3b5bdb; padding-bottom:8px; margin-bottom:10px;}
    #print-root .meta{font-size:12px; color:#555;}
    #print-root .stats span{margin-right:14px; font-size:12.5px;}
    #print-root{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>

<script>
/* ===== 老浏览器兼容补丁：closest / matches / classList.toggle(名,真假) 缺失时补上。
   不补的话，老浏览器里每一次点击都会在第一行抛错 —— 表现就是"点登录没反应、页面也不报错"。 ===== */
(function(){
  try{
    if(!Element.prototype.matches){
      Element.prototype.matches = Element.prototype.msMatchesSelector || Element.prototype.webkitMatchesSelector;
    }
    if(!Element.prototype.closest){
      Element.prototype.closest = function(sel){
        var el = this;
        while(el && el.nodeType === 1){
          if(el.matches && el.matches(sel)){ return el; }
          el = el.parentElement || el.parentNode;
        }
        return null;
      };
    }
    var probe = document.createElement("div");
    probe.classList.add("zzq");
    probe.classList.toggle("zzq", true);
    var toggleOk = probe.classList.contains("zzq");     // 老浏览器会忽略第二个参数，把类删掉 → false
    if(!toggleOk && DOMTokenList && DOMTokenList.prototype){
      var orig = DOMTokenList.prototype.toggle;
      DOMTokenList.prototype.toggle = function(c, force){
        if(force === undefined){ return orig.call(this, c); }
        if(force){ this.add(c); } else { this.remove(c); }
        return !!force;
      };
    }
  }catch(e){}
})();
/* ===== 启动自检：脚本没跑起来 / 中途报错时，直接在页面上显示出来，不再"静默失效" ===== */
(function(){
  function show(msg){
    try{
      var el = document.getElementById("boot-err");
      if(!el){ return; }
      el.style.display = "block";
      el.innerHTML = "⚠️ 页面没能正常启动（把这段截图发给小宇）：\n" + msg
        + "\n\n先按 ⌘⇧R（Windows：Ctrl+F5）强制刷新；还不行就换个浏览器或用无痕窗口打开。";
    }catch(e){}
  }
  window.addEventListener("error", function(e){
    if(e && e.target && e.target.tagName === "SCRIPT" && e.target.src){ show("脚本文件没加载成功：" + e.target.src); return; }
    show((e && e.message ? e.message : "未知错误") + (e && e.lineno ? "（第 " + e.lineno + " 行）" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason;
    show("异步报错：" + ((r && (r.message || r)) || "未知"));
  });
  window.__teacherBooted = false;
  setTimeout(function(){
    if(!window.__teacherBooted){
      show("脚本 6 秒内没有初始化完成 —— 多半是这个文件没下载完整，或者被浏览器/插件拦住了。");
    }
  }, 6000);
})();
</script>

<script>
(function(){

  function q(s){ return document.querySelector(s); }
  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); }

  // ===== 演示模式：页面地址后面加 ?demo=1 就能看到"有数据时"的样子（全在内存里，不写数据库）=====
  var DEMO = /[?&]demo=1/.test(location.search);
  var DEMO_STUDENTS = [
    {sid:"20240101", name:"张三", practiceCount:8, avgAccuracy:69, todayCount:4, lastTs:"2026-10-12 16:40",

  ];
  var DEMO_WRONGS = {
    "20240101":[["performer","n.表演者",4,"perform","看词选义","2026-10-12 16:38"],
                ["audience","n.观众",3,"viewer","默写闯关","2026-10-12 16:36"],
                ["old-fashioned","adj.老式的",2,"oldfashioned","拼写闯关","2026-10-12 16:30"],
                ["unless","conj.除非",2,"until","缺字母补全","2026-10-11 19:20"],
                ["amaze","v.使惊奇",2,"amuse","看词选义","2026-10-11 19:12"],
                ["puppet","n.木偶",1,"puppy","看词选义","2026-10-10 19:06"],
                ["teenager","n.青少年",1,"teenage","拼写闯关","2026-10-10 19:05"],
                ["wealthy","adj.富有的",1,"healthy","默写闯关","2026-10-10 19:04"],
                ["grandma","n.奶奶",1,"grandpa","看词选义","2026-10-10 19:02"],
                ["foolish","adj.愚蠢的",1,"fool","缺字母补全","2026-10-10 18:58"],
                ["yard","n.院子",1,"yardstick","拼写闯关","2026-10-10 18:55"],
                ["electric","adj.电动的",1,"electrical","默写闯关","2026-10-10 18:52"]],
    "20240102":[["teenager","n.青少年",3,"teenage","拼写闯关","2026-10-12 15:00"],
                ["puppet","n.木偶",2,"puppy","看词选义","2026-10-12 14:52"],

  var DEMO_RECORDS = {

                ["2026-10-12 16:36","拼写闯关",1,"九上 Unit 1",17,20,85,88,2],
                ["2026-10-12 16:20","缺字母补全",1,"九上 Unit 1",18,20,90,101,3],
                ["2026-10-12 16:05","默写闯关",1,"九上 Unit 1",16,20,80,142,2],
                ["2026-10-10 19:05","看词选义",1,"九上 Unit 1",11,20,55,150,1],
                ["2026-10-10 18:50","拼写闯关",2,"九上 Unit 1",12,20,60,158,1],
                ["2026-10-10 18:35","缺字母补全",1,"九上 Unit 1",9,20,45,166,0],
                ["2026-10-10 18:20","默写闯关",1,"九上 Unit 1",10,20,50,172,0]],
    "20240102":[["2026-10-12 15:02","看词选义",1,"九上 Unit 1",14,20,70,101,1],

    "20240104":[]
  };
  function demoMask(v){
    v = String(v || "");
    return v.length >= 7 ? (v.slice(0,3) + "****" + v.slice(-2)) : v;
  }
  function demoSummary(){

  }
  function demoDaily(){

  function demoStudent(sid){
    var st = null;
    demoSummary().students.forEach(function(s){ if(s.sid === sid){ st = s; } });
    if(!st){ st = DEMO_STUDENTS[0]; st.sidMasked = demoMask(st.sid); }

    var last = dayStat(days[0]);
    var first = dayStat(days[days.length - 1]);
    if(days.length === 1){ first = last; }
    var has2 = days.length >= 2 && first.day !== last.day;
    var good = [], bad = [];
    if(has2){
      var dAcc = last.accuracy - first.accuracy;
      if(dAcc >= 5){ good.push('正确率从 ' + first.accuracy + '% 提到 ' + last.accuracy + '%（+' + dAcc + ' 个百分点）'); }
      else if(dAcc <= -5){ bad.push('正确率从 ' + first.accuracy + '% 掉到 ' + last.accuracy + '%（' + dAcc + ' 个百分点）'); }
      if(last.wrongN < first.wrongN){ good.push('当天错的词从 ' + first.wrongN + ' 个减到 ' + last.wrongN + ' 个'); }
      else if(last.wrongN > first.wrongN){ bad.push('当天错的词从 ' + first.wrongN + ' 个增到 ' + last.wrongN + ' 个'); }
      if(last.questions > first.questions){ good.push('练习量从 ' + first.questions + ' 题增到 ' + last.questions + ' 题'); }
      else if(last.questions < first.questions){ bad.push('练习量从 ' + first.questions + ' 题减到 ' + last.questions + ' 题'); }
      // 第一天错过的词，现在已掌握几个（成长点）
      var wb = {};
      (d.wrongs || []).forEach(function(w){ wb[String(w.word || '').toLowerCase()] = w; });
      var fixed = 0, stillWrong = [];
      first.wrongs.forEach(function(w){
        var cur = wb[String(w.word).toLowerCase()];
        if(cur && cur.level === '已掌握'){ fixed++; }
        else if(cur && cur.level === '未掌握'){ stillWrong.push(w.word); }
      });
      if(fixed > 0){ good.push('第一天错的 ' + first.wrongN + ' 个词里，已有 ' + fixed + ' 个掌握'); }
      // 老问题反复：最近一天错的词里，第一天也错过的
      var firstSet = {};
      first.wrongs.forEach(function(w){ firstSet[String(w.word).toLowerCase()] = 1; });
      var repeat = last.wrongs.filter(function(w){
        var k = String(w.word).toLowerCase();
        var cur = wb[k];
        return firstSet[k] && !(cur && cur.level === '已掌握');    // 现在已掌握的不算"还没搞定"
      }).map(function(w){ return w.word; });
      if(repeat.length){ bad.push('有 ' + repeat.length + ' 个词从第一天错到现在还没搞定：' + repeat.slice(0, 6).join('、') + (repeat.length > 6 ? '…' : '')); }
      if(stillWrong.length){ bad.push('还有 ' + stillWrong.length + ' 个词一直没掌握（未掌握）：' + stillWrong.slice(0, 6).join('、') + (stillWrong.length > 6 ? '…' : '')); }
      // 按玩法：两天都练过的玩法对比
      Object.keys(last.modes).forEach(function(k){
        if(first.modes[k]){
          var diff = last.modes[k].accuracy - first.modes[k].accuracy;
          if(diff >= 5){ good.push('「' + k + '」正确率 ' + first.modes[k].accuracy + '% → ' + last.modes[k].accuracy + '%'); }
          else if(diff <= -5){ bad.push('「' + k + '」正确率 ' + first.modes[k].accuracy + '% → ' + last.modes[k].accuracy + '%'); }
        }
      });
      // 隔了多久没练
      var gap = Math.round((new Date(last.day + "T00:00:00") - new Date(first.day + "T00:00:00")) / 86400000);
      if(gap >= 1){
        var now = new Date(); now.setHours(0,0,0,0);
        var idle = Math.round((now - new Date(last.day + "T00:00:00")) / 86400000);
        if(idle >= 3){ bad.push('距最近一次练习已经 ' + idle + ' 天了'); }
      }
    }
    return {days:days, first:first, last:last, has2:has2, good:good, bad:bad, totalDays:days.length};
  }
  // 对比条（起点 vs 现在）
  function cmpBar(label, a, b, unit, goodUp){
    var max = Math.max(a, b, 1);
    var wa = Math.round(a / max * 100), wb = Math.round(b / max * 100);
    var diff = b - a;
    var arrow = diff === 0 ? '<span class="muted">持平</span>'
      : '<span class="' + ((goodUp ? diff > 0 : diff < 0) ? 'gup' : 'gdown') + '">' + (diff > 0 ? '▲ +' : '▼ ') + Math.abs(diff) + unit + '</span>';
    return '<div class="cmprow"><span class="cmpname">' + esc(label) + '</span>'
      + '<span class="cmpb"><i style="width:' + wa + '%"></i><em>第一天 ' + a + unit + '</em></span>'
      + '<span class="cmpb is-now"><i style="width:' + wb + '%"></i><em>最新 ' + b + unit + '</em></span>'
      + '<span class="cmpd">' + arrow + '</span></div>';
  }
  // 每日正确率折线（SVG，最多最近 14 天，标出第一天和最新一天）
  function trendSvg(g){
    var days = g.days.slice(0, 14).slice().reverse();      // 老 → 新
    if(days.length < 2){ return ''; }
    var W = 620, H = 170, padL = 38, padR = 14, padT = 14, padB = 26;
    var n = days.length;
    var step = (W - padL - padR) / (n - 1);
    function x(i){ return padL + i * step; }
    function y(v){ return padT + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - padT - padB); }
    var pts = days.map(function(d, i){ return x(i) + "," + y(d.accuracy); }).join(" ");
    var area = padL + "," + y(0) + " " + pts + " " + x(n - 1) + "," + y(0);
    var dots = days.map(function(d, i){
      var first = (i === 0), last = (i === n - 1);
      var r = (first || last) ? 4.5 : 3;
      var fill = last ? "#0f9d76" : (first ? "#e5484d" : "#3b5bdb");
      return '<circle cx="' + x(i) + '" cy="' + y(d.accuracy) + '" r="' + r + '" fill="' + fill + '"></circle>';
    }).join("");
    var labels = days.map(function(d, i){
      if(n > 8 && i !== 0 && i !== n - 1 && i % 3 !== 0){ return ''; }
      return '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="9.5" fill="#8a93a6" text-anchor="middle">' + esc(String(d.day).slice(5)) + '</text>';
    }).join("");
    var vals = days.map(function(d, i){
      if(i !== 0 && i !== n - 1){ return ''; }
      return '<text x="' + x(i) + '" y="' + (y(d.accuracy) - 8) + '" font-size="10.5" font-weight="700" fill="' + (i === n - 1 ? "#0f9d76" : "#e5484d") + '" text-anchor="middle">' + d.accuracy + '%</text>';
    }).join("");
    return '<div class="vpre-chartbox"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="每日正确率">'
      + [0, 25, 50, 75, 100].map(function(v){
          return '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" stroke="' + (v === 0 ? "#d7dce7" : "#eef1f7") + '"></line>'
            + '<text x="' + (padL - 6) + '" y="' + (y(v) + 3.5) + '" font-size="9.5" fill="#8a93a6" text-anchor="end">' + v + '%</text>';
        }).join("")
      + '<polygon points="' + area + '" fill="rgba(59,91,219,.10)"></polygon>'
      + '<polyline points="' + pts + '" fill="none" stroke="#3b5bdb" stroke-width="2.2" stroke-linejoin="round"></polyline>'
      + dots + labels + vals
      + '</svg><div class="muted" style="text-align:center; margin-top:2px;">每天的正确率（红点=第一天 ' + g.first.accuracy + '%，绿点=最新一天 ' + g.last.accuracy + '%）</div></div>';
  }
  // ===== 使用前后对比的文字说明（自动生成一段话，屏幕和打印稿都用） =====
  function growthText(g, d){
    if(!g){ return ""; }
    var name = (d && d.student && d.student.name) ? d.student.name : "该学生";
    if(!g.has2){
      return name + "目前只有 " + g.last.day + " 一天的数据（答题 " + g.last.questions + " 题，正确率 "
        + g.last.accuracy + "%）。至少练满两天，才能做使用前后的对比。";
    }
    var f = g.first, l = g.last, t = [];
    t.push(name + "从 " + f.day + " 开始使用，到 " + l.day + " 一共练了 " + g.totalDays + " 天（第一天 "
      + f.questions + " 题、最新一天 " + l.questions + " 题）。");
    var dAcc = l.accuracy - f.accuracy;
    t.push("正确率从 " + f.accuracy + "% 到 " + l.accuracy + "%"
      + (dAcc === 0 ? "，基本持平；" : (dAcc > 0 ? ("，提升了 " + dAcc + " 个百分点；") : ("，下降了 " + Math.abs(dAcc) + " 个百分点；"))));
    t.push("当天错词从 " + f.wrongN + " 个" + (l.wrongN === f.wrongN ? "持平" : (l.wrongN < f.wrongN ? ("减少到 " + l.wrongN + " 个") : ("增加到 " + l.wrongN + " 个"))) + "。");
    var m = (d && d.mastery) || {};
    t.push("目前累计已掌握 " + (m.mastered || 0) + " 个词、待巩固 " + (m.shaky || 0) + " 个、未掌握 " + (m.weak || 0) + " 个。");
    var todo = [];
    ((d && d.wrongs) || []).forEach(function(w){ if(w.level === "未掌握"){ todo.push(w.word); } });
    if(todo.length){
      t.push("建议重点复习这 " + todo.length + " 个还没掌握的词：" + todo.slice(0, 10).join("、") + (todo.length > 10 ? " 等" : "") + "。");
    } else if((m.shaky || 0) > 0){
      t.push("建议把 " + m.shaky + " 个待巩固的词再各练一轮，争取升到已掌握。");
    } else {
      t.push("目前没有明显薄弱的词，继续保持。");
    }
    return t.join("");
  }
  function growthHtml(d){

  function cmpHintSingle(r){

  // 把"按日期统计 / 练习记录 / 当天错题"按日期拼到一起
  function dailyJoin(daily, records, wrongs){
    return (daily || []).map(function(r){
      var rs = (records || []).filter(function(x){ return x.day === r.day; });
      var ws = (wrongs || []).filter(function(x){ return x.day === r.day; });
      return {day:r.day, questions:r.questions, correct:r.correct, accuracy:r.accuracy,
              practices:r.practices, seconds:r.seconds, records:rs, wrongs:ws};
    });

  function fmtDur(sec){
    sec = Number(sec) || 0;

  }
  function wChoice(w){ return w.last_choice || w.chosen || ""; }

  // ===== 每日一练：先把练习日期列出来，点某个日期再看当天练了什么 =====
  function todayStr(){

              + '<td class="muted">' + esc(w.module || '') + '</td><td class="muted">' + esc(String(w.ts || '').slice(5, 16)) + '</td></tr>';
          }).join('') + '</tbody></table></div>';

  // 每日一练：一行一个日期（左边日期、右边当天的总结果），点某一行才展开当天的详细结果

  function wrongTable(rows){
    if(!rows.length){ return '<div class="empty">这个词表暂时没有错词，很棒！</div>'; }
    return '<div style="overflow:auto;"><table><thead><tr><th>单词</th><th>释义</th><th>错次</th><th>最近错选</th><th>模块</th><th>最近时间</th></tr></thead><tbody>'
      + rows.map(function(w){
          return '<tr><td><b>' + esc(w.word) + '</b></td><td class="muted">' + esc(w.meaning || '') + '</td>'
            + '<td><span class="pill no">' + w.wrong_count + '</span></td>'
            + '<td class="muted">' + esc(w.last_choice || '') + '</td>'
            + '<td class="muted">' + esc(w.last_module || '') + '</td>'
            + '<td class="muted">' + esc((w.last_ts || '').slice(0, 16)) + '</td></tr>';
        }).join("") + '</tbody></table></div>';
  }
  function recordTable(rows){
    if(!rows.length){ return '<div class="empty">还没有练习记录</div>'; }
    return '<div style="overflow:auto;"><table><thead><tr><th>时间</th><th>模块</th><th>单元</th><th>组</th><th>单词数</th><th>答对</th><th>正确率</th><th>用时</th><th>星星</th></tr></thead><tbody>'
      + rows.map(function(r){
          return '<tr><td class="muted">' + esc((r.ts || '').slice(0, 16)) + '</td><td>' + esc(r.mode) + '</td>'
            + '<td class="muted">' + esc((r.book || '') + ' ' + (r.unit || '')) + '</td>'
            + '<td>' + (r.group_no ? ('第 ' + r.group_no + ' 组') : '—') + '</td>'
            + '<td>' + (r.total || 0) + ' 个</td>'
            + '<td>' + r.correct + '</td>'
            + '<td>' + r.accuracy + '%</td>'
            + '<td class="muted">' + fmtDur(r.duration) + '</td>'
            + '<td>' + r.stars + '</td></tr>';
        }).join("") + '</tbody></table></div>';
  }
  function fillPrint(inner){
    var d = S.detail;
    var root = q("#print-root");
    var head = '<div class="head"><h1>单词大冒险 · ' + esc(d.student.name) + '</h1>'
      + '<div class="meta">学号 ' + esc(d.student.sidMasked) + ' · 生成时间 ' + new Date().toLocaleString('zh-CN') + ' · 练习 ' + d.practiceCount + ' 次</div>'
      + '<div class="stats" style="margin-top:6px;"><span>已掌握 ' + d.mastery.mastered + '</span><span>待巩固 ' + d.mastery.shaky + '</span><span>未掌握 ' + d.mastery.weak + '</span></div></div>';
    root.innerHTML = head + inner;
    window.print();
  }
  // 某一天的错词（把同一天的同一个词合并，按错次排序）
  function dayWrongRows(day){
    var r = (S.detail.daily || []).filter(function(x){ return x.day === day; })[0];
    if(!r){ return []; }
    var map = {}, out = [];
    (r.wrongs || []).forEach(function(w){
      var k = String(w.word || '').toLowerCase();
      if(!map[k]){
        map[k] = {word:w.word, meaning:w.meaning, wrong_count:0, last_choice:wChoice(w), last_module:wModule(w), last_ts:wTs(w)};
        out.push(map[k]);
      }
      map[k].wrong_count += 1;
      var ts = wTs(w);
      if(ts && ts > (map[k].last_ts || "")){ map[k].last_ts = ts; }
    });
    out.sort(function(a, b){ return b.wrong_count - a.wrong_count; });
    return out;
  }
  // 错词表（打印稿里用）
  function wrongTableHtml(rows){
    if(!rows.length){ return '<p>没有错词。</p>'; }
    return '<table><thead><tr><th>单词</th><th>释义</th><th>错次</th><th>最近错选</th><th>模块</th><th>最近时间</th></tr></thead><tbody>'
      + rows.map(function(w){
          return '<tr><td><b>' + esc(w.word) + '</b></td><td>' + esc(w.meaning || '') + '</td><td>' + (w.wrong_count || 0) + '</td><td>'
            + esc(w.last_choice || '') + '</td><td>' + esc(w.last_module || '') + '</td><td>' + esc(String(w.last_ts || '').slice(0, 16)) + '</td></tr>';
        }).join("") + '</tbody></table>';
  }
  // 容器里所有「🖨 打印这天错题」按钮（切换日期后要重新绑）
  function bindPrintDay(scopeEl){
    if(!scopeEl){ return; }
    [].slice.call(scopeEl.querySelectorAll("[data-print-day]")).forEach(function(b){
      b.addEventListener("click", function(e){
        if(e && e.stopPropagation){ e.stopPropagation(); }   // 别触发所在日期行的展开/收起
        printWrong([b.getAttribute("data-print-day")]);
      });
    });
  }
  // days：数组。空数组 = 全部累计错词；否则按勾选的日期分天打印
  function printWrong(days){
    var d = S.detail;
    var list = (days && days.length) ? days.slice().sort() : null;
    var body, meta, total = 0;
    if(list){
      body = list.map(function(day){
        var rows = dayWrongRows(day);
        total += rows.length;
        return '<h2>' + esc(day) + ' 的错词（' + rows.length + ' 个）</h2>' + wrongTableHtml(rows);
      }).join("");
      meta = '打印日期：' + esc(list.join('、')) + ' · 共 ' + total + ' 个错词';
    } else {
      var all = (d.wrongs || []);
      total = all.length;
      body = '<h2>全部错词（累计，按错次）· 共 ' + total + ' 个</h2>' + wrongTableHtml(all);
      meta = '范围：全部错词（累计，按错次）· 共 ' + total + ' 个';
    }
    fillPrint('<h2>错题本（第二天复习用）</h2><p class="meta">' + meta + '</p>' + body);
  }
  function printReport(){
    var d = S.detail;
    var modes = (d.modes || []).map(function(m){ return m.mode + ' ' + m.count + ' 次（平均 ' + m.avgAccuracy + '%）'; }).join('、') || '暂无';
    var records = '<table><thead><tr><th>时间</th><th>模块</th><th>单元</th><th>正确率</th><th>用时</th></tr></thead><tbody>'
      + (d.records || []).map(function(r){
          return '<tr><td>' + esc((r.ts || '').slice(0, 16)) + '</td><td>' + esc(r.mode) + '</td><td>'
            + esc((r.book || '') + ' ' + (r.unit || '')) + '</td><td>' + r.accuracy + '%（' + r.correct + '/' + r.total + '）</td><td>' + r.duration + 's</td></tr>';
        }).join("") + '</tbody></table>';
    var g2 = growth(d);
    var grow = (g2 && g2.has2)
      ? '<h2>学情报告分析（第一天 ' + esc(g2.first.day) + ' → 最新一天 ' + esc(g2.last.day) + '）</h2>'
        + '<p class="meta" style="line-height:1.95;">' + esc(growthText(g2, d)) + '</p>'
        + '<table><thead><tr><th>指标</th><th>第一天</th><th>最新一天</th><th>变化</th></tr></thead><tbody>'
        + '<tr><td>正确率</td><td>' + g2.first.accuracy + '%</td><td>' + g2.last.accuracy + '%</td><td>'
          + (g2.last.accuracy - g2.first.accuracy === 0 ? '持平' : ((g2.last.accuracy > g2.first.accuracy ? '提升 ' : '下降 ') + Math.abs(g2.last.accuracy - g2.first.accuracy) + ' 个百分点')) + '</td></tr>'
        + '<tr><td>当天错词</td><td>' + g2.first.wrongN + ' 个</td><td>' + g2.last.wrongN + ' 个</td><td>'
          + (g2.last.wrongN === g2.first.wrongN ? '持平' : (g2.last.wrongN < g2.first.wrongN ? '减少 ' + (g2.first.wrongN - g2.last.wrongN) + ' 个' : '增加 ' + (g2.last.wrongN - g2.first.wrongN) + ' 个')) + '</td></tr>'
        + '<tr><td>当天答题</td><td>' + g2.first.questions + ' 题</td><td>' + g2.last.questions + ' 题</td><td>'
          + (g2.last.questions === g2.first.questions ? '持平' : (g2.last.questions > g2.first.questions ? '增加 ' + (g2.last.questions - g2.first.questions) + ' 题' : '减少 ' + (g2.first.questions - g2.last.questions) + ' 题')) + '</td></tr>'
        + '<tr><td>练完组数</td><td>' + g2.first.practices + ' 组</td><td>' + g2.last.practices + ' 组</td><td>共练了 ' + g2.totalDays + ' 天</td></tr>'
        + '</tbody></table>'
        + '<h3 style="font-size:13px; margin:12px 0 4px;">成长点</h3>'
        + '<p class="meta">' + ((g2.good.length ? g2.good.map(function(t){ return '· ' + esc(t); }).join('<br>') : '暂无明显进步点')) + '</p>'
        + '<h3 style="font-size:13px; margin:12px 0 4px;">失误点 / 要注意</h3>'
        + '<p class="meta">' + ((g2.bad.length ? g2.bad.map(function(t){ return '· ' + esc(t); }).join('<br>') : '暂无明显问题')) + '</p>'
      : '';
    var daily = (d.daily || []);
    var dailyTbl = daily.length
      ? '<h2>按日期统计</h2><table><thead><tr><th>日期</th><th>答题</th><th>答对</th><th>正确率</th><th>练完组数</th><th>用时</th></tr></thead><tbody>'
        + daily.map(function(r){
            return '<tr><td>' + esc(r.day) + '</td><td>' + (r.questions||0) + '</td><td>' + (r.correct||0) + '</td><td>'
              + (r.accuracy||0) + '%</td><td>' + (r.practices||0) + '</td><td>' + Math.round((Number(r.seconds)||0)/60) + ' 分钟</td></tr>';
          }).join("") + '</tbody></table>'
      : '';
    fillPrint(grow + dailyTbl
      + '<h2>学习概况</h2><p class="meta">练习模块：' + esc(modes) + '</p>'
      + '<h2>练习记录</h2>' + records);
  }
  function printList(){
    var d = S.summary;
    if(!d){ return; }
    var body = '<table><thead><tr><th>姓名</th><th>今日</th><th>练习次数</th><th>平均正确率</th><th>已掌握</th><th>待巩固</th><th>未掌握</th><th>最近练习</th></tr></thead><tbody>'
      + d.students.map(function(s){
          return '<tr><td>' + esc(s.name) + '</td><td>' + (s.practicedToday ? '已练' : '未练') + '</td><td>' + s.practiceCount + '</td><td>'
            + s.avgAccuracy + '%</td><td>' + s.mastered + '</td><td>' + s.shaky + '</td><td>' + s.weak + '</td><td>' + esc((s.lastTs || '').slice(0, 16)) + '</td></tr>';
        }).join("") + '</tbody></table>';
    var root = q("#print-root");
    root.innerHTML = '<div class="head"><h1>单词大冒险 · 学生统计</h1><div class="meta">统计日期 ' + esc(d.date)
      + ' · 学生 ' + d.totals.students + ' 人 · 今日已练 ' + d.totals.practiced + ' 人 · 平均正确率 ' + d.totals.avgAccuracy + '%</div></div>' + body;
    window.print();
  }
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("button, a");
    if(!t) return;
    if(t.id === "btn-refresh"){ load(); }
    if(t.id === "btn-diag-test"){ diagTest(); return; }
    if(t.id === "btn-diag-reset"){ diagReset(); return; }
    if(t.id === "btn-login"){
      var em = (q("#li-email").value || "").trim(), pw = q("#li-pass").value || "";
      if(!em || !pw){ q("#li-msg").textContent = "邮箱和密码都要填"; return; }
      q("#li-msg").textContent = "正在登录…";
      sbLogin(em, pw).then(function(){ q("#li-msg").textContent = ""; q("#li-pass").value = ""; load(); })
        .catch(function(e){ q("#li-msg").textContent = (e && e.message) || "登录失败"; });
      return;
    }
    if(t.id === "btn-clear-all"){ clearAllData(); return; }
    if(t.id === "btn-logout"){ saveSession(null); S.summary = null; S.detail = null; q("#detail").innerHTML = ""; q("#tbody").innerHTML = ""; q("#btn-clear-all").style.display = "none"; needLogin(); return; }
    if(t.id === "btn-toggle-phone"){ S.showFull = !S.showFull; t.textContent = S.showFull ? "隐藏学号" : "显示完整学号"; renderTable(); }
    if(t.id === "btn-print-list"){ printList(); }
    if(t.id === "btn-csv"){ if(CLOUD || DEMO){ ev.preventDefault(); exportCsv(); } }
    var open = t.getAttribute("data-open");
    if(open){ openStudent(open); }
  });
  document.addEventListener("click", function(ev){
    var tr = ev.target.closest("tr.clk");
    if(tr && !ev.target.closest("button") && !ev.target.closest("a")){ openStudent(tr.getAttribute("data-sid")); }
  });
  function exportCsv(){
    if(!S.summary){ alert("数据还没加载出来"); return; }
    downloadCsv("单词大冒险-学生统计.csv",
      ["姓名", "学号", "今日", "练习次数", "平均正确率", "已掌握", "待巩固", "未掌握", "最近练习"],
      S.summary.students.map(function(s){
        return [s.name, S.showFull ? s.sid : s.sidMasked, s.practicedToday ? "已练" : "未练",
                s.practiceCount, s.avgAccuracy + "%", s.mastered, s.shaky, s.weak, s.lastTs || ""];
      }));
  }
  ["li-email","li-pass"].forEach(function(id){
    var el = q("#" + id);
    if(el){
      el.addEventListener("keydown", function(ev){
        if(ev.key !== "Enter"){ return; }
        if(ev.isComposing || ev.keyCode === 229){ return; }
        ev.preventDefault();
        var b = q("#btn-login"); if(b){ b.click(); }
      });
    }
  });
  if(DEMO){
    q("#login").style.display = "none";
    load();
  } else if(CLOUD){
    q("#btn-logout").style.display = "none";
    if(session && session.refresh_token){ load(); } else { needLogin(); }
  } else {
    load();
  }
  window.__teacherBooted = true;      // 告诉启动自检：脚本已经跑完了
})();
</script>
</body>
</html>
