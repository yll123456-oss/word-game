<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老师后台 · 单词大冒险</title>
<style>
  :root{--ink:#1f2430; --muted:#6b7280; --line:#e6e9f0; --blue:#3b5bdb; --soft:#eef1fb; --red:#e5484d; --amber:#b45309; --green:#0f9d76;}
  body{margin:0; background:#f4f6fb; color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 18px 70px;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  h1{font-size:19px; margin:0;}
  .sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}
  button, a.btn{border:0; background:var(--blue); color:#fff; font-size:13px; font-weight:700; padding:9px 14px; border-radius:11px; cursor:pointer; text-decoration:none; display:inline-block;}
  button.ghost, a.ghost{background:var(--soft); color:var(--blue);}
  button:active{transform:scale(.99);}
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; box-shadow:0 6px 18px rgba(31,41,55,.05);}
  .card b{display:block; font-size:22px; color:var(--blue);}
  .card span{font-size:11.5px; color:var(--muted);}
  .panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 6px 18px rgba(31,41,55,.05);}
  .panel h2{font-size:14px; margin:0 0 12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line);}
  th{font-size:11.5px; color:var(--muted); font-weight:600; background:#fafbfe;}
  tr.clk{cursor:pointer;}
  tr.clk:hover td{background:#fafbff;}
  .pill{display:inline-block; font-size:11px; padding:3px 8px; border-radius:99px; font-weight:600;}
  .pill.ok{background:#e7f7f1; color:var(--green);}
  .pill.no{background:#fdecec; color:var(--red);}
  .pill.warn{background:#fdf3e6; color:var(--amber);}
  .pill.gray{background:#f1f2f5; color:var(--muted);}
  .muted{color:var(--muted); font-size:12px;}
  .empty{color:var(--muted); font-size:13px; padding:14px 0; text-align:center;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:10px 0 6px;}
  .gbox{background:#fafbfe; border:1px solid var(--line); border-radius:13px; padding:11px 12px;}
  .gbox span{display:block; font-size:11.5px; color:var(--muted);}
  .gbox b{display:block; font-size:19px; margin:3px 0 2px;}
  .gbox em{font-style:normal; font-size:12px; font-weight:700;}
  .gup{color:var(--green);}
  .gdown{color:var(--red);}
  .grow-line{font-size:13px; line-height:1.9;}
  .grow-line b{font-size:15px;}
  @media (max-width:820px){ .cards{grid-template-columns:1fr 1fr;} .two{grid-template-columns:1fr;} }
  #print-root{display:none;}
  @media print{
    body{background:#fff;}
    .wrap{display:none;}
    #print-root{display:block !important; padding:0; max-width:100%;}
    #print-root h1{font-size:18px; margin:0 0 4px;}
    #print-root h2{font-size:14px; margin:16px 0 8px;}
    #print-root table{font-size:12.5px;}
    #print-root th,#print-root td{border-bottom:1px solid #ddd; padding:6px 6px;}
    #print-root thead th{background:#f4f6fb;}
    #print-root .head{border-bottom:2px solid #3b5bdb; padding-bottom:8px; margin-bottom:10px;}
    #print-root .meta{font-size:12px; color:#555;}
    #print-root .stats span{margin-right:14px; font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>单词大冒险 · 老师后台</h1>
      <div class="sub" id="subline">正在加载数据…</div>
    </div>
    <div class="btns">
      <button class="ghost" id="btn-refresh" type="button">刷新数据</button>
      <a class="btn ghost" href="/api/export.csv" id="btn-csv">导出统计(CSV)</a>
      <button id="btn-print-list" type="button">打印学生统计</button>
      <button class="ghost" id="btn-logout" type="button" style="display:none;">退出登录</button>
      <button class="ghost" id="btn-clear-all" type="button" style="display:none; color:#e5484d;">🧹 清空学生数据</button>
    </div>
  </div>

  <div class="panel" id="login" style="display:none;">
    <h2>老师登录 <span class="muted" style="font-weight:400; font-size:12px;">（云端数据只有登录后才能看）</span></h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <input id="li-email" type="email" autocomplete="username" placeholder="老师邮箱"
             style="flex:1; min-width:200px; padding:10px 12px; border:1px solid #dfe3ea; border-radius:10px; font-size:14px;">
      <input id="li-pass" type="password" autocomplete="current-password" placeholder="密码"
             style="flex:1; min-width:160px; padding:10px 12px; border:1px solid #dfe3ea; border-radius:10px; font-size:14px;">
      <button id="btn-login" type="button">登录</button>
    </div>
    <div class="muted" id="li-msg" style="margin-top:10px; min-height:18px;"></div>
    <div class="muted" style="margin-top:2px;">登录状态会记住：下次打开这个页面直接进，不用重新登录（换了电脑或清了缓存才需要再登一次）。</div>
  </div>

  <div class="cards">
    <div class="card"><b id="k-students">0</b><span>学生总数</span></div>
    <div class="card"><b id="k-done">0</b><span>今日已练</span></div>
    <div class="card"><b id="k-new">0</b><span>今日新增注册</span></div>
    <div class="card"><b id="k-never">0</b><span>注册未练习</span></div>
  </div>

  <div class="panel">
    <h2>学生列表（未练的排在最前）</h2>
    <div style="overflow:auto;">
      <table>
        <thead><tr>
          <th>姓名</th><th>学号</th><th>今日</th><th>练习次数</th><th>平均正确率</th>
          <th>已掌握</th><th>待巩固</th><th>未掌握</th><th>最近练习</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="10" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="muted" style="margin-top:8px;">
      点击任意一行查看该学生的错题本和练习记录；<button class="ghost" id="btn-toggle-phone" type="button" style="padding:4px 10px; font-size:11.5px;">显示完整学号</button>
    </div>
  </div>

  <div id="detail"></div>
</div>

<div id="print-root"></div>

<script>
(function(){
  var S = {summary:null, detail:null, current:null, showFull:false};
  function q(s){ return document.querySelector(s); }
  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); }

  // ===== 演示模式：页面地址后面加 ?demo=1 就能看到"有数据时"的样子（全在内存里，不写数据库）=====
  var DEMO = /[?&]demo=1/.test(location.search);
  var DEMO_STUDENTS = [
    {sid:"20240101", name:"张三", practiceCount:8, avgAccuracy:69, todayCount:4, lastTs:"2026-10-12 16:40",
     weak:2, shaky:2, mastered:18, needReview:4, practicedToday:true, isDemo:true},
    {sid:"20240102", name:"李四", practiceCount:2, avgAccuracy:65, todayCount:1, lastTs:"2026-10-12 15:02",
     weak:2, shaky:3, mastered:5, needReview:5, practicedToday:true, isDemo:true},
    {sid:"20240103", name:"王五", practiceCount:1, avgAccuracy:45, todayCount:0, lastTs:"2026-10-10 20:15",
     weak:1, shaky:1, mastered:1, needReview:2, practicedToday:false, isDemo:true},
    {sid:"20240104", name:"赵六", practiceCount:0, avgAccuracy:0, todayCount:0, lastTs:"2026-10-12 08:30",
     weak:0, shaky:0, mastered:0, needReview:0, practicedToday:false, isDemo:true}
  ];
  var DEMO_WRONGS = {
    "20240101":[["performer","n.表演者",4,"perform","看词选义","2026-10-12 16:38"],
                ["audience","n.观众",3,"viewer","默写闯关","2026-10-12 16:36"],
                ["old-fashioned","adj.老式的",2,"oldfashioned","拼写闯关","2026-10-12 16:30"],
                ["unless","conj.除非",2,"until","缺字母补全","2026-10-11 19:20"],
                ["amaze","v.使惊奇",2,"amuse","看词选义","2026-10-11 19:12"],
                ["puppet","n.木偶",1,"puppy","看词选义","2026-10-10 19:06"],
                ["teenager","n.青少年",1,"teenage","拼写闯关","2026-10-10 19:05"],
                ["wealthy","adj.富有的",1,"healthy","默写闯关","2026-10-10 19:04"],
                ["grandma","n.奶奶",1,"grandpa","看词选义","2026-10-10 19:02"],
                ["foolish","adj.愚蠢的",1,"fool","缺字母补全","2026-10-10 18:58"],
                ["yard","n.院子",1,"yardstick","拼写闯关","2026-10-10 18:55"],
                ["electric","adj.电动的",1,"electrical","默写闯关","2026-10-10 18:52"]],
    "20240102":[["teenager","n.青少年",3,"teenage","拼写闯关","2026-10-12 15:00"],
                ["puppet","n.木偶",2,"puppy","看词选义","2026-10-12 14:52"],
                ["performer","n.表演者",2,"perform","看词选义","2026-10-12 14:50"],
                ["audience","n.观众",2,"viewer","默写闯关","2026-10-12 14:48"],
                ["amaze","v.使惊奇",1,"amuse","缺字母补全","2026-10-11 21:08"],
                ["wealthy","adj.富有的",2,"healthy","默写闯关","2026-10-11 21:05"]],
    "20240103":[["take part in","参加",3,"take part","看词选义","2026-10-10 20:10"],
                ["high school","高中",2,"hightschool","缺字母补全","2026-10-10 20:05"]],
    "20240104":[]
  };
  var DEMO_RECORDS = {
    "20240101":[["2026-10-12 16:40","看词选义",1,"九上 Unit 1",18,20,90,96,3],
                ["2026-10-12 16:36","拼写闯关",1,"九上 Unit 1",17,20,85,88,2],
                ["2026-10-12 16:20","缺字母补全",1,"九上 Unit 1",18,20,90,101,3],
                ["2026-10-12 16:05","默写闯关",1,"九上 Unit 1",16,20,80,142,2],
                ["2026-10-10 19:05","看词选义",1,"九上 Unit 1",11,20,55,150,1],
                ["2026-10-10 18:50","拼写闯关",2,"九上 Unit 1",12,20,60,158,1],
                ["2026-10-10 18:35","缺字母补全",1,"九上 Unit 1",9,20,45,166,0],
                ["2026-10-10 18:20","默写闯关",1,"九上 Unit 1",10,20,50,172,0]],
    "20240102":[["2026-10-12 15:02","看词选义",1,"九上 Unit 1",14,20,70,101,1],
                ["2026-10-11 21:05","缺字母补全",1,"九上 Unit 1",12,20,60,133,1]],
    "20240103":[["2026-10-10 20:15","看词选义",1,"九上 Unit 1",9,20,45,150,0]],
    "20240104":[]
  };
  function demoMask(v){
    v = String(v || "");
    return v.length >= 7 ? (v.slice(0,3) + "****" + v.slice(-2)) : v;
  }
  function demoSummary(){
    return {
      date: "2026-10-12",
      totals: {students:4, practiced:2, notPracticed:2, records:8, avgAccuracy:74, newToday:2, neverPracticed:1},
      students: DEMO_STUDENTS.map(function(s){
        var o = JSON.parse(JSON.stringify(s)); o.phoneMasked = demoMask(o.sid); o.sidMasked = demoMask(o.sid); return o;
      })
    };
  }
  function demoStudent(sid){
    var st = null;
    demoSummary().students.forEach(function(s){ if(s.sid === sid){ st = s; } });
    if(!st){ st = DEMO_STUDENTS[0]; st.sidMasked = demoMask(st.sid); }
    var modes = {};
    (DEMO_RECORDS[sid] || []).forEach(function(r){
      var m = modes[r[1]] || (modes[r[1]] = {mode:r[1], count:0, sum:0});
      m.count++; m.sum += r[6];
    });
    return {
      student:{sid:st.sid, sidMasked:st.sidMasked || demoMask(st.sid), name:st.name, firstSeen:"", lastSeen:st.lastTs},
      records:(DEMO_RECORDS[sid] || []).map(function(r, i){
        return {id:i+1, ts:r[0], mode:r[1], group_no:r[2], book:r[3].split(" ")[0], unit:r[3].split(" ").slice(1).join(" "),
                correct:r[4], total:r[5], accuracy:r[6], duration:r[7], stars:r[8]};
      }),
      wrongs:(DEMO_WRONGS[sid] || []).map(function(w){
        return {word:w[0], meaning:w[1], wrong_count:w[2], last_choice:w[3], last_module:w[4], last_ts:w[5], level:w[2]>=2?"未掌握":"待巩固"};
      }),
      words:[], mastery:{weak:st.weak, shaky:st.shaky, mastered:st.mastered},
      modes:Object.keys(modes).map(function(k){ return {mode:k, count:modes[k].count, avgAccuracy:Math.round(modes[k].sum/modes[k].count)}; }),
      practiceCount:st.practiceCount
    };
  }

  // ===== 数据源配置 =====
  // 留空 = 读本机的 server.py（/api/*，只有这台电脑能看）
  // 填上下面两项 = 读 Supabase 云端（需要用下面那个老师邮箱+密码登录后才能看）
  //   url：Supabase 项目地址，形如 https://xxxxxxxx.supabase.co
  //   key：项目设置里的 anon public key（可以公开，未登录读不到数据）
  var SUPABASE = { url:"https://vixsmcezymbrpcipqwzc.supabase.co", key:"sb_publishable_RXPNOIBeDoVRl8QVBed2iw_lIs6btLH" };
  var CLOUD = !!(SUPABASE.url && SUPABASE.key);
  var SKEY = "vpreTeacherSession";
  var session = null;
  try{ session = JSON.parse(localStorage.getItem(SKEY) || "null"); }catch(e){ session = null; }

  function sbBase(){ return SUPABASE.url.replace(/\/+$/, ""); }
  function saveSession(v){
    session = v;
    try{
      if(v){ localStorage.setItem(SKEY, JSON.stringify(v)); }
      else { localStorage.removeItem(SKEY); }
    }catch(e){}
  }
  function sbLogin(email, password){
    return fetch(sbBase() + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{"Content-Type":"application/json", "apikey":SUPABASE.key},
      body:JSON.stringify({email:email, password:password})
    }).catch(function(){
      throw new Error("连不上 Supabase（网络被拦或断网）。换个网络试试，比如手机热点");
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(r.ok){ return d; }
        var raw = d.msg || d.error_description || d.message || d.error || ("HTTP " + r.status);
        var msg = raw;
        if(/confirm/i.test(raw)){ msg = "这个邮箱还没激活 —— 去 Supabase → Authentication → Users，勾上 Auto Confirm User（或删掉重建一个账号）"; }
        else if(/invalid/i.test(raw)){ msg = "邮箱或密码不对（注意大小写；忘了就在 Supabase → Users 里改密码）"; }
        else if(/rate|too many/i.test(raw)){ msg = "登录尝试太频繁，等 1 分钟再试"; }
        throw new Error(msg + "（原始提示：" + raw + "）");
      });
    }).then(function(d){
      saveSession({access_token:d.access_token, refresh_token:d.refresh_token,
                   exp:Date.now() + (d.expires_in || 3600) * 1000});
      try{ localStorage.setItem("vpreTeacherEmail", email); }catch(e){}
      return true;
    });
  }
  function sbRefresh(){
    if(!session || !session.refresh_token){ return Promise.resolve(false); }
    return fetch(sbBase() + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST",
      headers:{"Content-Type":"application/json", "apikey":SUPABASE.key},
      body:JSON.stringify({refresh_token:session.refresh_token})
    }).then(function(r){ if(!r.ok){ throw new Error("refresh"); } return r.json(); })
      .then(function(d){
        saveSession({access_token:d.access_token, refresh_token:d.refresh_token,
                     exp:Date.now() + (d.expires_in || 3600) * 1000});
        return true;
      }).catch(function(){ saveSession(null); return false; });
  }
  function sbToken(){
    if(session && session.exp && session.exp - 60000 > Date.now()){ return Promise.resolve(session.access_token); }
    return sbRefresh().then(function(ok){ return ok ? session.access_token : null; });
  }
  // 读 Supabase 的视图：sbGet("v_students?order=...")
  function sbGet(path){
    return sbToken().then(function(tk){
      if(!tk){ throw new Error("NO_SESSION"); }
      return fetch(sbBase() + "/rest/v1/" + path, {
        headers:{"apikey":SUPABASE.key, "Authorization":"Bearer " + tk, "Accept":"application/json"}
      });
    }).then(function(r){
      if(r.status === 401 || r.status === 403){ throw new Error("NO_SESSION"); }
      if(!r.ok){ throw new Error("HTTP " + r.status); }
      return r.json();
    });
  }
  function sbPost(path, body){
    return sbToken().then(function(tk){
      if(!tk){ throw new Error("NO_SESSION"); }
      return fetch(sbBase() + "/rest/v1/rpc/" + path, {
        method:"POST",
        headers:{"Content-Type":"application/json", "apikey":SUPABASE.key, "Authorization":"Bearer " + tk},
        body:JSON.stringify(body || {})
      });
    }).then(function(r){
      if(r.status === 401 || r.status === 403){ throw new Error("NO_SESSION"); }
      if(!r.ok){ throw new Error("HTTP " + r.status); }
      return r.json();
    });
  }
  function sbQ(v){ return encodeURIComponent(v); }
  function csvText(header, rows){
    function cell(v){
      var t = String(v == null ? "" : v);
      return /[",\n]/.test(t) ? ('"' + t.replace(/"/g, '""') + '"') : t;
    }
    return "\ufeff" + [header].concat(rows).map(function(r){ return r.map(cell).join(","); }).join("\r\n");
  }
  function downloadCsv(filename, header, rows){
    var blob = new Blob([csvText(header, rows)], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  // 一键清空所有学生数据（云端：调用只有老师能用的 admin_clear_data；本机：/api/clear-all）
  function clearAllData(){
    var where = CLOUD ? "云端（Supabase）" : "本机";
    if(!confirm("确定清空" + where + "的所有学生数据吗？\n\n会删除：学生名单、练习记录、题级明细、错词本（掌握度）。\n不会删除：老师账号、表结构。\n\n删掉后无法恢复。")){ return; }
    var p = CLOUD ? sbPost("admin_clear_data", {}) : apiPost("/api/clear-all", {});
    p.then(function(){
      alert("已清空" + where + "的所有学生数据 ✅");
      S.summary = null; S.detail = null; S.current = null;
      q("#detail").innerHTML = "";
      load();
    }).catch(function(e){
      var m = String((e && e.message) || e);
      if(m === "NO_SESSION"){ needLogin(); return; }
      if(/404|find the function|not exist/i.test(m)){
        alert("云端还没有\"一键清空\"函数：请在 Supabase 的 SQL Editor 里重新跑一遍最新的 supabase/schema.sql（幂等，不会丢数据），再点这个按钮。");
        return;
      }
      alert("清空失败：" + m);
    });
  }
  function apiPost(path, body){
    return fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body || {})})
      .then(function(r){ if(!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); });
  }
  function needLogin(){
    q("#login").style.display = "block";
    q("#btn-logout").style.display = "none";
    q("#subline").textContent = "请先用老师账号登录";
    try{
      var last = localStorage.getItem("vpreTeacherEmail");
      var em = q("#li-email");
      if(last && em && !em.value){ em.value = last; var pw = q("#li-pass"); if(pw){ pw.focus(); } }
    }catch(e){}
  }
  // 云端模式下的"总览"：把 v_totals + v_students 拼成和本机接口一样的形状
  function cloudSummary(){
    return Promise.all([sbGet("v_totals?select=*"), sbGet("v_students?select=*")]).then(function(a){
      var t = (a[0] || [])[0] || {};
      return {
        date: t.date || "",
        totals: {
          students: t.students || 0, practiced: t.practiced || 0,
          notPracticed: t.notPracticed || 0, records: t.records || 0,
          avgAccuracy: t.avgAccuracy || 0, newToday: t.newToday || 0,
          neverPracticed: t.neverPracticed || 0
        },
        students: a[1] || []
      };
    });
  }
  // 云端模式下的单个学生档案：拼成和本机 /api/student 一样的形状
  function cloudStudent(sid){

      sbGet("v_wrongs?select=*&sid=eq." + sbQ(sid) + "&order=wrong_count.desc"),

        practiceCount:s.practiceCount || 0

  // ===== 使用前后对比：起点 = 第一次练习，现在 = 最近 3 次 =====
  function growthStats(d){
    var recs = (d.records || []).slice();          // 新的在前（本机与云端都是倒序）
    if(!recs.length){ return null; }
    function acc(r){ return Number(r.accuracy) || 0; }
    function avg(a){ if(!a.length){ return 0; } var s = 0; a.forEach(function(r){ s += acc(r); }); return Math.round(s / a.length); }
    var oldest = recs[recs.length - 1];
    var earlySet = recs.slice(-3), recentSet = recs.slice(0, 3);
    function day(ts){ return String(ts || "").slice(0, 10); }
    var earlyFrom = day(earlySet[earlySet.length-1].ts), earlyTo = day(earlySet[0].ts);
    var recentFrom = day(recentSet[recentSet.length-1].ts), recentTo = day(recentSet[0].ts);
    var words = 0, dur = 0, stars = 0;
    recs.forEach(function(r){ words += Number(r.total) || 0; dur += Number(r.duration) || 0; stars += Number(r.stars) || 0; });
    // 按玩法各算一组（四种玩法难度不同，分开看更公平）
    var byMode = {}, modeOrder = [];
    recs.forEach(function(r){
      var m = r.mode || "其它";
      if(!byMode[m]){ byMode[m] = []; modeOrder.push(m); }
      byMode[m].push(r);
    });
    var modes = modeOrder.map(function(m){
      var arr = byMode[m];                       // 新 → 旧
      var n = arr.length, useAvg = (n >= 6);     // 记录少时比"首练 vs 最近一次"，够 6 次才用 3 次平均
      return {mode:m, n:n, useAvg:useAvg,
              early:(useAvg ? avg(arr.slice(-3)) : acc(arr[n-1])),
              recent:(useAvg ? avg(arr.slice(0,3)) : acc(arr[0]))};
    });
    var wronged = (d.wrongs || []).length;                                  // 曾错过的词（累计）
    var todo = (d.mastery.weak || 0);                                       // 现在还没搞定的（未掌握）
    var firstDay = String(oldest.ts || "").slice(0, 10);
    var days = 0;
    if(firstDay){
      var t0 = new Date(firstDay + "T00:00:00");
      days = Math.max(1, Math.round((new Date() - t0) / 86400000) + 1);
    }
    return {firstDay:firstDay, days:days, firstAcc:acc(oldest), earlyAcc:avg(earlySet), recentAcc:avg(recentSet),
            earlyFrom:earlyFrom, earlyTo:earlyTo, recentFrom:recentFrom, recentTo:recentTo,
            earlyN:earlySet.length, recentN:recentSet.length, overlap:(recs.length < 6), modes:modes,
            practices:recs.length, words:words, minutes:Math.round(dur / 60), stars:stars,
            wronged:wronged, todo:todo, fixed:Math.max(0, wronged - todo), mastered:(d.mastery.mastered || 0)};
  }
  function growthHtml(d){
    var g = growthStats(d);
    if(!g){
      return '<div class="panel"><h2>使用前后对比</h2><div class="empty">还没有练习记录，练完第一组就能看到对比</div></div>';
    }
    function delta(cur, base, goodUp){
      var v = cur - base;
      if(v === 0){ return '<em class="muted">持平</em>'; }
      var up = v > 0, good = goodUp ? up : !up;
      return '<em class="' + (good ? 'gup' : 'gdown') + '">' + (up ? '▲ +' : '▼ -') + Math.abs(v) + '</em>';
    }
    function rng(from, to, n, word){
      var d = (from === to) ? from : (from + "~" + to);
      return "（" + word + " " + n + " 次 · " + d + "）";
    }
    return '<div class="panel"><h2>使用前后对比 <span class="muted" style="font-weight:400;font-size:12px;">'
        + '起步' + rng(g.earlyFrom, g.earlyTo, g.earlyN, "最早") + ' · 现在' + rng(g.recentFrom, g.recentTo, g.recentN, "最近") + '</span></h2>'
      + '<div class="grow">'
      +   '<div class="gbox"><span>正确率</span><b>' + g.earlyAcc + '% → ' + g.recentAcc + '%</b>' + delta(g.recentAcc, g.earlyAcc, true) + '</div>'
      +   '<div class="gbox"><span>错词</span><b>错过 ' + g.wronged + ' 个 → 还没搞定 ' + g.todo + ' 个</b>'
      +     (g.fixed > 0 ? '<em class="gup">已收掉 ' + g.fixed + ' 个</em>' : '<em class="muted">暂时没有减少</em>') + '</div>'
      +   '<div class="gbox"><span>已掌握</span><b>' + g.mastered + ' 词</b><em class="muted">累计练过 ' + g.words + ' 词次</em></div>'
      + '</div>'
      + '<div class="grow-line">从 <b>' + esc(g.firstDay) + '</b> 开始用，到今天是第 <b>' + g.days + '</b> 天，一共练了 <b>' + g.practices + '</b> 次'
      + '（' + g.words + ' 词次 · 约 ' + g.minutes + ' 分钟 · ' + g.stars + ' 颗星）；正确率从 <b>' + g.earlyAcc + '%</b> 提升到 <b>' + g.recentAcc + '%</b>，'
      + '错过 <b>' + g.wronged + '</b> 个词，现在还没搞定 <b>' + g.todo + '</b> 个，已掌握 <b>' + g.mastered + '</b> 词。</div>'
      + (g.overlap ? '<div class="muted" style="margin-top:6px;">目前只练了 ' + g.practices + ' 次，起步和现在这两端有重叠，练到 6 次以上对比最准。</div>' : '')
      + modeTable(g)
      + '</div>';
  }
  // 按玩法明细：四种玩法难度不同，分开看能排除"难度差异"的干扰
  function modeDelta(a, b){
    var v = b - a;
    if(v === 0){ return '<span class="muted">持平</span>'; }
    return '<span class="' + (v > 0 ? 'gup' : 'gdown') + '">' + (v > 0 ? '▲ +' : '▼ -') + Math.abs(v) + '</span>';
  }
  function modeTable(g, forPrint){
    if(!g || !g.modes || !g.modes.length){ return ''; }
    var rows = g.modes.map(function(m){
      return '<tr><td>' + esc(m.mode) + ' <span class="muted">（' + m.n + ' 次）</span></td>'
        + '<td>' + m.early + '%</td><td>' + m.recent + '%</td>'
        + '<td>' + (forPrint ? modePlainDelta(m.early, m.recent) : modeDelta(m.early, m.recent)) + '</td></tr>';
    }).join('');
    return '<table style="margin-top:12px;"><thead><tr><th>按玩法看</th><th>起步</th><th>现在</th><th>变化</th></tr></thead><tbody>'
      + rows + '</tbody></table>'
      + '<div class="muted" style="margin-top:6px;">每种玩法记录不足 6 次时，起步 = 第一次、现在 = 最近一次；满 6 次则各取 3 次平均。</div>';
  }
  function modePlainDelta(a, b){
    var v = b - a;
    if(v === 0){ return '持平'; }
    return (v > 0 ? '提升 ' : '下降 ') + Math.abs(v) + ' 个百分点';
  }

    if(t.id === "btn-clear-all"){ clearAllData(); return; }
    if(t.id === "btn-logout"){ saveSession(null); S.summary = null; S.detail = null; q("#detail").innerHTML = ""; q("#tbody").innerHTML = ""; q("#btn-clear-all").style.display = "none"; needLogin(); return; }
    if(t.id === "btn-toggle-phone"){ S.showFull = !S.showFull; t.textContent = S.showFull ? "隐藏学号" : "显示完整学号"; renderTable(); }
    if(t.id === "btn-print-list"){ printList(); }
    if(t.id === "btn-csv"){ if(CLOUD || DEMO){ ev.preventDefault(); exportCsv(); } }
    var open = t.getAttribute("data-open");
    if(open){ openStudent(open); }
  });
  document.addEventListener("click", function(ev){
    var tr = ev.target.closest("tr.clk");
    if(tr && !ev.target.closest("button") && !ev.target.closest("a")){ openStudent(tr.getAttribute("data-sid")); }
  });
  function exportCsv(){
    if(!S.summary){ alert("数据还没加载出来"); return; }
    downloadCsv("单词大冒险-学生统计.csv",
      ["姓名", "学号", "今日", "练习次数", "平均正确率", "已掌握", "待巩固", "未掌握", "最近练习"],
      S.summary.students.map(function(s){
        return [s.name, S.showFull ? s.sid : s.sidMasked, s.practicedToday ? "已练" : "未练",
                s.practiceCount, s.avgAccuracy + "%", s.mastered, s.shaky, s.weak, s.lastTs || ""];
      }));
  }
  ["li-email","li-pass"].forEach(function(id){
    var el = q("#" + id);
    if(el){
      el.addEventListener("keydown", function(ev){
        if(ev.key !== "Enter"){ return; }
        if(ev.isComposing || ev.keyCode === 229){ return; }
        ev.preventDefault();
        var b = q("#btn-login"); if(b){ b.click(); }
      });
    }
  });
  if(DEMO){
    q("#login").style.display = "none";
    load();
  } else if(CLOUD){
    q("#btn-logout").style.display = "none";
    if(session && session.refresh_token){ load(); } else { needLogin(); }
  } else {
    load();
  }
})();
</script>
</body>
</html>
